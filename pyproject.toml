[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtm-enrich"
version = "0.1.0"
description = "Scrape a homepage with any of four backends, answer GTM questions about it with Claude or GPT, and write the answers back to Salesforce or HubSpot."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rob O'Connor" }]
keywords = [
  "revops", "gtm", "enrichment", "salesforce", "hubspot",
  "claude", "openai", "firecrawl", "crawl4ai", "apify",
]

dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.0",
  # LLM providers. Both are small and pure-Python, so both ship by default and
  # `--provider` just works. Every scraper backend talks raw HTTP over httpx --
  # Firecrawl, crawl4ai, and Apify need no SDK of their own.
  "anthropic>=1.0",
  "openai>=2.0",
]

[project.optional-dependencies]
# The webhook service. Not needed for the CLI, scheduled runs, or the tests
# that cover everything except the HTTP layer.
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = [
  "pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6",
  "fastapi>=0.115", "uvicorn[standard]>=0.30",
]

[project.scripts]
gtm-enrich = "gtm_enrich.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_enrich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's whole API is function calls in argument defaults.
"src/gtm_enrich/cli.py" = ["B008"]
