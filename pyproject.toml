[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtm-enrich"
version = "0.1.0"
description = "Scrape a homepage, answer GTM questions about it, write the answers back to Salesforce or HubSpot."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rob O'Connor" }]
keywords = ["revops", "gtm", "enrichment", "salesforce", "hubspot", "claude"]

dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
gtm-enrich = "gtm_enrich.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_enrich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's whole API is function calls in argument defaults.
"src/gtm_enrich/cli.py" = ["B008"]
